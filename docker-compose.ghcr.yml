# Run from PREBUILT images on GHCR — no source checkout / build needed.
# This is the one-command path for end users.
#
#   # 1. data dir (chat.db + workspaces persist here, on the HOST)
#   sudo mkdir -p /var/lib/nuke-ai-collaborator/workspaces
#   sudo chown -R "$(id -u):$(id -g)" /var/lib/nuke-ai-collaborator
#
#   # 2. pull + run
#   docker compose -f docker-compose.ghcr.yml up -d
#   docker compose -f docker-compose.ghcr.yml logs -f app
#
#   # 3. open http://localhost:8000  →  set model API keys via the 🔑 button
#
# Compose pulls the per-group sandbox image before the app starts. The default
# group + BA/Dev/QA bots are seeded on first boot. Keys live in the UI — never bake
# them into this file; if you must inject via env, uncomment the lines below.
services:
  sandbox-image:
    image: ghcr.io/nuke-yu/nuke-sandbox:latest
    pull_policy: always
    entrypoint: ["/bin/true"]
    restart: "no"

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: nuke-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      PING: 1
      VERSION: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      GRPC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    restart: unless-stopped

  app:
    image: ghcr.io/nuke-yu/nuke-ai-collaborator:latest
    container_name: nuke-app
    pull_policy: always
    depends_on:
      docker-proxy:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      NUKE_ENV: production
      NUKE_DB_PATH: /var/lib/nuke-ai-collaborator/chat.db
      NUKE_WORKSPACE_ROOT: /var/lib/nuke-ai-collaborator/workspaces
      NUKE_WORKERS: 6
      NUKE_SHELL_EXEC_BACKEND: container
      NUKE_SANDBOX_IMAGE: ghcr.io/nuke-yu/nuke-sandbox:latest
      DOCKER_HOST: tcp://docker-proxy:2375
      # ── REQUIRED: security credentials ──
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (≥32 chars)}
      NUKE_OPERATOR_USERS: ${NUKE_OPERATOR_USERS:?Set NUKE_OPERATOR_USERS to at least one admin username}
    volumes:
      - /var/lib/nuke-ai-collaborator:/var/lib/nuke-ai-collaborator
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
