version: '3.8'

# Standalone single-container deploy using Docker Named Volumes.
# No host directories, no sudo mkdir, no docker.sock mount, no separate sandbox image needed.
# Just build/pull and run immediately.
#
# ⚠️  WARNING: This is a DEV / TRUSTED SINGLE-USER deployment only.
#    - NUKE_SHELL_EXEC_BACKEND=local means bot shell commands run directly
#      in the app container with NO per-group sandbox isolation.
#    - All group workspaces and the central DB share one named volume;
#      any bot can access any group's data via absolute paths.
#    - Do NOT use this for multi-group production or any environment
#      where different human users need group-level security isolation.
#    - For production multi-group deployment, use docker-compose.yml
#      with the container sandbox backend.
#
# Run:  docker compose -f docker-compose.standalone.yml up -d --build
# URL:  http://localhost:8080

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuke-ai-collaborator:latest
    container_name: nuke-app
    ports:
      # Host 8080 -> container 8000
      - "8080:8000"
    environment:
      # No NUKE_ENV=production — standalone is dev/trusted single-user only.
      # Production deployments must use docker-compose.yml with container sandbox.
      NUKE_DB_PATH: /var/lib/nuke-ai-collaborator/chat.db
      NUKE_WORKSPACE_ROOT: /var/lib/nuke-ai-collaborator/workspaces
      NUKE_WORKERS: 4
      # Local shell: no per-group sandbox. See warning above.
      NUKE_SHELL_EXEC_BACKEND: local
    volumes:
      # Automatically managed Docker named volume
      - nuke-data:/var/lib/nuke-ai-collaborator
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  nuke-data:
