version: '3.8'

# Standalone single-container deploy using Docker Named Volumes.
# No host directories, no sudo mkdir, no docker.sock mount, no separate sandbox image needed.
# Just build/pull and run immediately.
#
# Run:  docker compose -f docker-compose.standalone.yml up -d --build
# URL:  http://localhost:8080

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuke-ai-collaborator:latest
    container_name: nuke-app
    ports:
      # Host 8080 -> container 8000
      - "8080:8000"
    environment:
      NUKE_ENV: production
      NUKE_DB_PATH: /var/lib/nuke-ai-collaborator/chat.db
      NUKE_WORKSPACE_ROOT: /var/lib/nuke-ai-collaborator/workspaces
      NUKE_WORKERS: 4
      # Use local shell execution backend to run inside this container
      NUKE_SHELL_EXEC_BACKEND: local
    volumes:
      # Automatically managed Docker named volume
      - nuke-data:/var/lib/nuke-ai-collaborator
    restart: unless-stopped

volumes:
  nuke-data:
