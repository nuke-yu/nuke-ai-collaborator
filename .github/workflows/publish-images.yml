# Build & publish multi-arch (amd64 + arm64) images to GitHub Container Registry.
#
# Triggers:
#   - push a semver tag  →  git tag v1.0.0 && git push --tags
#   - manual run         →  Actions tab → "Publish images" → Run workflow (pick a tag)
#
# Publishes TWO images (the app + the per-group sandbox it spawns):
#   ghcr.io/<owner>/nuke-ai-collaborator
#   ghcr.io/<owner>/nuke-sandbox
#
# First publish: the GHCR packages default to PRIVATE. Make them public once in
# GitHub → your profile/org → Packages → <pkg> → Package settings → Change visibility.
name: Publish images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.0.0 or latest)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write        # lets GITHUB_TOKEN push to GHCR — no PAT needed

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one image failing shouldn't abort the other
      matrix:
        include:
          - image: nuke-ai-collaborator
            context: .
            dockerfile: Dockerfile
          - image: nuke-sandbox
            context: deploy/sandbox
            dockerfile: deploy/sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # QEMU enables building the non-native arch (arm64 on amd64 runners) via emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
