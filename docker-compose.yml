# Single-container deploy: backend + served frontend in one service. The
# per-group execution sandboxes are SEPARATE containers the app spawns at
# runtime via the mounted docker socket.
#
# Prerequisites on the host:
#   1. Build the sandbox image (the app spawns it, compose does not):
#        docker build -t nuke-sandbox:latest deploy/sandbox
#   2. Create the data dir (chat.db + workspaces live here, on the HOST):
#        sudo mkdir -p /var/lib/nuke-ai-collaborator/workspaces
#        sudo chown -R "$(id -u):$(id -g)" /var/lib/nuke-ai-collaborator
#   3. docker compose up -d --build
#
# Why these volumes (the two gotchas of running the app in Docker):
#   - docker.sock: lets the app dispatch sandbox containers. This is ≈ host root;
#     in production front it with a socket-proxy that only allows run/exec/stop.
#   - the data dir is mounted at the SAME path inside the container as on the
#     host, because the sibling sandbox containers' `--mount src=<host path>` is
#     resolved by the host daemon — paths must line up.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuke-ai-collaborator:latest
    container_name: nuke-app
    ports:
      # Host 8080 → container 8000. Kept off 8000 so the Docker deploy stack stays
      # physically separate from a local dev backend (uvicorn on 127.0.0.1:8000).
      - "8080:8000"
    environment:
      NUKE_ENV: production
      NUKE_DB_PATH: /var/lib/nuke-ai-collaborator/chat.db
      NUKE_WORKSPACE_ROOT: /var/lib/nuke-ai-collaborator/workspaces
      # Worker processes serving group shards. Default 4. Set ≈ host CPU cores.
      # NOTE: only helps if groups are spread across workers (see group routing).
      NUKE_WORKERS: 6
      # enable the per-group container sandbox (default is "local" = no isolation)
      NUKE_SHELL_EXEC_BACKEND: container
      NUKE_SANDBOX_IMAGE: nuke-sandbox:latest
      # API keys: pass here (bootstrap_from_env migrates them into app_config.json),
      # or mount app_config.json (see volumes note below).
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/nuke-ai-collaborator:/var/lib/nuke-ai-collaborator
      # Persist API keys across restarts (optional — else pass keys via env above):
      # - ./backend/app_config.json:/app/backend/app_config.json
    restart: unless-stopped
