# Single-container deploy: backend + served frontend in one service. The
# per-group execution sandboxes are SEPARATE containers the app spawns at
# runtime via the mounted docker socket.
#
# Prerequisites on the host:
#   1. Build the sandbox image (the app spawns it, compose does not):
#        docker build -t nuke-sandbox:latest deploy/sandbox
#   2. Create the data dir (chat.db + workspaces live here, on the HOST):
#        sudo mkdir -p /var/lib/nuke-ai-collaborator/workspaces
#        sudo chown -R "$(id -u):$(id -g)" /var/lib/nuke-ai-collaborator
#   3. docker compose up -d --build
#
# Why these volumes (the two gotchas of running the app in Docker):
#   - docker.sock: lets the app dispatch sandbox containers. This is ≈ host root;
#     in production front it with a socket-proxy that only allows run/exec/stop.
#   - the data dir is mounted at the SAME path inside the container as on the
#     host, because the sibling sandbox containers' `--mount src=<host path>` is
#     resolved by the host daemon — paths must line up.

services:
  # Socket proxy: limits which Docker API sections the app can access.
  # Stage 1 defense — blocks build/swarm/secrets/plugins/volumes/networks.
  # Residual risk: container create API is allowed, so an attacker who
  # compromises the app container could still craft a container with
  # host bind mounts. Stage 2 (authorization plugin or rootless daemon)
  # is needed to fully close host-root risk.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: nuke-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Allow only what the sandbox executor needs
      CONTAINERS: 1    # create, inspect, exec, stop sandbox containers
      EXEC: 1          # exec into running containers
      POST: 1          # required for create/exec API calls
      # Block everything else
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      GRPC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PING: 1          # required by Docker client for connectivity check
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 1       # required by Docker client for API version negotiation
      VOLUMES: 0
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuke-ai-collaborator:latest
    container_name: nuke-app
    depends_on:
      - docker-proxy
    ports:
      # Host 8080 → container 8000. Kept off 8000 so the Docker deploy stack stays
      # physically separate from a local dev backend (uvicorn on 127.0.0.1:8000).
      - "8080:8000"
    environment:
      NUKE_ENV: production
      NUKE_DB_PATH: /var/lib/nuke-ai-collaborator/chat.db
      NUKE_WORKSPACE_ROOT: /var/lib/nuke-ai-collaborator/workspaces
      # Worker processes serving group shards. Default 8. Tune for host capacity.
      # NOTE: only helps if groups are spread across workers (see group routing).
      NUKE_WORKERS: 8
      # enable the per-group container sandbox (default is "local" = no isolation)
      NUKE_SHELL_EXEC_BACKEND: container
      NUKE_SANDBOX_IMAGE: nuke-sandbox:latest
      # Point the Docker client at the proxy instead of the raw socket
      DOCKER_HOST: tcp://docker-proxy:2375
      # ── REQUIRED: security credentials ──────────────────────────────
      # AUTH_SECRET: strong random key (≥32 chars) for JWT signing.
      #   Generate: python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      #   App refuses to start without it in production mode.
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET (minimum 32 chars; generate with python3 secrets.token_urlsafe)}"
      # Operator privileges are stored in users.is_operator. The first account
      # registered on a new installation is bootstrapped as the operator.
      NUKE_GITHUB_ENABLED: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN for repository and pull-request access}
      # API keys: pass here (bootstrap_from_env migrates them into app_config.json),
      # or mount app_config.json (see volumes note below).
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Native Channel connectors are configured with a secret-free JSON list.
      # Descriptor fields name environment variables; they never contain values.
      NUKE_CHANNEL_PLATFORMS_JSON: '${NUKE_CHANNEL_PLATFORMS_JSON:-[]}'
      # Example descriptor (put on one line in .env):
      # [{"type":"feishu","channel_instance_id":"feishu:prod","app_id_env":"FEISHU_APP_ID","app_secret_env":"FEISHU_APP_SECRET","verification_token_env":"FEISHU_VERIFY_TOKEN","encrypt_key_env":"FEISHU_ENCRYPT_KEY"},{"type":"wechat_ilink","channel_instance_id":"wechat:personal","bot_id_env":"WECHAT_ILINK_BOT_ID","bot_token_env":"WECHAT_ILINK_BOT_TOKEN"}]
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFY_TOKEN: ${FEISHU_VERIFY_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      WECHAT_ILINK_BOT_ID: ${WECHAT_ILINK_BOT_ID:-}
      WECHAT_ILINK_BOT_TOKEN: ${WECHAT_ILINK_BOT_TOKEN:-}
    volumes:
      # No raw docker.sock mount — app talks to docker-proxy via DOCKER_HOST
      - /var/lib/nuke-ai-collaborator:/var/lib/nuke-ai-collaborator
      # Persist API keys across restarts (optional — else pass keys via env above):
      # - ./backend/app_config.json:/app/backend/app_config.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveness')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
